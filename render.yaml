# Render Blueprint — démonstration scolaire : services gratuits, paiements bloqués par défaut.
services:
  - type: web
    name: mon-miam-miam-rdc
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.18.0
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: '1'
      - key: PAYMENT_MODE
        value: disabled
      - key: DATABASE_URL
        fromDatabase:
          name: mon-miam-miam-db
          property: connectionString
      - key: EASYPAY_TOKEN
        sync: false
      - key: EASYPAY_CORRELATION_ID
        sync: false
      - key: EASYPAY_RESTAURANT_ID
        value: mon-miam-miam-kinshasa

databases:
  - name: mon-miam-miam-db
    plan: free
    region: frankfurt
    databaseName: monmiammiam
    user: monmiammiam
    ipAllowList: []
